# Manually triggered build, stamped with the build datetime so no version ever needs
# incrementing by hand. Defaults to the Windows/DirectML variant only; pick "all" for a
# full release of every loader and runtime variant.
#
# The variant tasks respawn child gradlew processes, so everything that must reach the
# actual builds (version override, caching, daemon) rides environment variables rather
# than command-line flags, which children would never see.
name: Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which runtime variants to build
        type: choice
        default: windows
        options:
          - windows
          - all

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The project's gradle.properties disables the daemon; in CI a shared daemon lets
      # the gradle invocations of a multi-variant build reuse one warm JVM, and the
      # build cache lets the variants compile the common sources once.
      GRADLE_OPTS: -Dorg.gradle.daemon=true -Dorg.gradle.caching=true -Dorg.gradle.parallel=true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Caches ~/.gradle/caches (dependencies, wrapper, Loom's remapped Minecraft) and
      # the local build cache, keyed on the wrapper and build files. Writes on the
      # default branch, restores everywhere.
      - uses: gradle/actions/setup-gradle@v6

      # NeoForge's decompiled-and-recompiled Minecraft lives outside the Gradle caches;
      # without this every cold run pays the several-minute NeoForm step again.
      - name: Cache NeoForm runtime
        uses: actions/cache@v5
        with:
          path: ~/.cache/neoformruntime
          key: neoformruntime-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: neoformruntime-${{ runner.os }}-

      - name: Stamp version with build datetime
        run: |
          BASE=$(grep -oP '^version=\K.*' gradle.properties)
          STAMP=$(date -u +'%Y.%m.%d-%H%M')
          VERSION="${BASE}+${STAMP}"
          echo "ORG_GRADLE_PROJECT_version=${VERSION}" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_mod_version=${VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_STAMP=${STAMP}" >> "$GITHUB_ENV"
          echo "Building ${VERSION} (${{ inputs.variant }})"

      - name: Build Windows/DirectML jars
        if: inputs.variant == 'windows'
        run: ./gradlew buildWindows

      - name: Build all release jars
        if: inputs.variant == 'all'
        run: ./gradlew collectReleaseJars

      # One artifact per loader per variant, so downloading DirectML never drags the
      # CUDA jar's bundled native libraries along. Windows always uploads; CUDA and CPU
      # only exist on a full release build.
      - name: Upload Fabric Windows/DirectML
        uses: actions/upload-artifact@v6
        with:
          name: terrain-diffusion-plus-fabric-windows-${{ env.BUILD_STAMP }}
          path: |
            fabric/build/libs/*-windows+*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-javadoc.jar
            !fabric/build/libs/*-dev.jar
          retention-days: 30

      - name: Upload NeoForge Windows/DirectML
        uses: actions/upload-artifact@v6
        with:
          name: terrain-diffusion-plus-neoforge-windows-${{ env.BUILD_STAMP }}
          path: |
            neoforge/build/libs/*-windows+*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-javadoc.jar
            !neoforge/build/libs/*-dev.jar
          retention-days: 30

      - name: Upload Fabric CUDA
        if: inputs.variant == 'all'
        uses: actions/upload-artifact@v6
        with:
          name: terrain-diffusion-plus-fabric-cuda-${{ env.BUILD_STAMP }}
          path: |
            fabric/build/libs/*-cuda+*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-javadoc.jar
            !fabric/build/libs/*-dev.jar
          retention-days: 30

      - name: Upload NeoForge CUDA
        if: inputs.variant == 'all'
        uses: actions/upload-artifact@v6
        with:
          name: terrain-diffusion-plus-neoforge-cuda-${{ env.BUILD_STAMP }}
          path: |
            neoforge/build/libs/*-cuda+*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-javadoc.jar
            !neoforge/build/libs/*-dev.jar
          retention-days: 30

      - name: Upload Fabric CPU/CoreML
        if: inputs.variant == 'all'
        uses: actions/upload-artifact@v6
        with:
          name: terrain-diffusion-plus-fabric-cpu-${{ env.BUILD_STAMP }}
          path: |
            fabric/build/libs/*-cpu+*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-javadoc.jar
            !fabric/build/libs/*-dev.jar
          retention-days: 30

      - name: Upload NeoForge CPU/CoreML
        if: inputs.variant == 'all'
        uses: actions/upload-artifact@v6
        with:
          name: terrain-diffusion-plus-neoforge-cpu-${{ env.BUILD_STAMP }}
          path: |
            neoforge/build/libs/*-cpu+*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-javadoc.jar
            !neoforge/build/libs/*-dev.jar
          retention-days: 30
