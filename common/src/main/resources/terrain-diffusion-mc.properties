# Terrain Diffusion MC configuration

# Inference device: "cpu", "gpu", or "auto" (try GPU first then fall back to CPU).
# Ignored for the CPU build.
inference.device=gpu

# Offload inactive models from VRAM so only one model occupies the GPU at a time.
# Keeps peak VRAM to 1.5-2 GB. Set to false if you have ~2.5+ GB of free VRAM:
# each model swap costs seconds of session rebuilding, so keeping all models
# resident speeds generation up noticeably. Falls back to offloading automatically
# if there is not enough VRAM to keep a model resident.
inference.offload_models=true

# Speculatively generate the terrain around the player while inference is idle,
# so walking into new land finds it already computed. Uses the GPU in the
# background; set to false if that competes with your frame rate.
inference.prefetch=true

# Validate SHA-256 for pre-existing files in .minecraft/terrain-diffusion-models.
# Set to false to allow custom user-provided models/config without hash checks.
validate_model=true

# Port for the local terrain explorer web UI (started with /td-explore command).
explorer.port=19801

# Terrain generation region side length in blocks. Must be a power of 2.
# Examples: 128, 256, 512, 1024.
# Use larger values to generate in larger batches (more chunks per second)
# Use smaller values to generate in smaller batches (most responsive)
tile_size=256

# Spawn search: coarse-pixel region sizes for land detection near (0,0).
# Starts at initial_size x initial_size, expands by 8 each iteration up to max_size x max_size.
spawn_search.initial_size=16
spawn_search.max_size=128